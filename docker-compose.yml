# Production stack: `docker compose up -d --build`.
# Settings come from the .env file next to this file (see .env.example).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibetacslop
      POSTGRES_USER: vibetacslop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibetacslop -d vibetacslop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in .env}
      DATABASE_URL: postgres://vibetacslop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/vibetacslop
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

volumes:
  pgdata:
