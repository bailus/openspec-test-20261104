{% load static %}{% load django_vite %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe-tac-slop</title>
    <script>
      // Apply the theme before first paint: the saved choice, else the system preference.
      // Keep in step with src/components/ThemeToggle.tsx (this template replaced index.html).
      try {
        const saved = localStorage.getItem('theme')
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        // Storage or matchMedia unavailable: stay light.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    {% vite_hmr_client %}
    {% vite_react_refresh %}
    {% vite_asset 'src/main.tsx' %}
  </body>
</html>
